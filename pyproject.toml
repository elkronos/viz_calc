[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viz_calc"
version = "1.1.0"
description = "Visual calculators: statistically sound, citable charts for pandas data that return the numbers behind the picture."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "elkronos" }]
requires-python = ">=3.10"
keywords = ["visualization", "statistics", "matplotlib", "pandas", "estimation", "effect size"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.11",
]

[project.optional-dependencies]
network = ["networkx>=3.2"]
interactive = ["plotly>=5.15"]
pptx = ["python-pptx>=0.6.21"]
all = ["viz_calc[network,interactive,pptx]"]
dev = ["viz_calc[all]", "pytest>=7", "ruff>=0.4"]
docs = ["viz_calc[all]", "mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[project.urls]
Documentation = "https://elkronos.github.io/viz_calc/"
Source = "https://github.com/elkronos/viz_calc"

[tool.hatch.build.targets.wheel]
packages = ["src/viz_calc"]

[tool.hatch.build.targets.sdist]
include = ["src/viz_calc", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE", "mkdocs.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::FutureWarning",
    "error::DeprecationWarning:viz_calc.*",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
