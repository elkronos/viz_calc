name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            deps: "numpy==1.24.4 pandas==2.0.3 matplotlib==3.7.5 scipy==1.11.4 networkx==3.2.1"
          - python: "3.11"
          - python: "3.12"
          - python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.deps }}" ]; then pip install ${{ matrix.deps }}; fi
          pip install -e ".[dev]" ${{ matrix.deps }}
      - name: Lint
        run: ruff check src tests examples
      - name: Test
        run: pytest
      - name: Build gallery
        run: python examples/gallery.py
