name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against the newest dependency releases, so upstream deprecations show up between pushes.
  # GitHub disables this schedule in a public repository after 60 days without repository activity.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    # A label keeps a job's name the same when its pins change.
    name: test (${{ matrix.python }}${{ matrix.label && format(', {0}', matrix.label) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lowest versions pyproject.toml allows; tests/test_packaging.py checks that the two agree.
          - python: "3.10"
            label: minimum versions
            deps: "numpy==1.24.1 pandas==2.0.0 matplotlib==3.7.0 scipy==1.11.1 networkx==3.2 plotly==5.15.0 python-pptx==0.6.21 python-dateutil==2.8.2"
          # The pandas 2.2 line, with the NumPy, Matplotlib and SciPy releases of its time.
          - python: "3.11"
            label: pandas 2.2
            deps: "pandas==2.2.3 numpy==2.0.2 matplotlib==3.9.4 scipy==1.14.1"
          # Core dependencies only, so the tests of networkx, plotly and python-pptx features must skip.
          - python: "3.13"
            label: no extras
            extras: none
          - python: "3.11"
          - python: "3.12"
          - python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.extras }}" = none ]; then
            pip install -e . "pytest>=7"
          else
            if [ -n "${{ matrix.deps }}" ]; then pip install ${{ matrix.deps }}; fi
            pip install -e ".[dev]" ${{ matrix.deps }}
          fi
      - name: Check that no optional dependency is installed
        if: matrix.extras == 'none'
        run: >-
          python -c "import importlib.util, sys;
          found = [m for m in ('networkx', 'plotly', 'pptx') if importlib.util.find_spec(m)];
          sys.exit(f'installed: {found}' if found else 0)"
      - name: Lint
        if: matrix.extras != 'none'
        run: ruff check src tests examples
      - name: Test
        run: pytest
      - name: Build gallery
        if: matrix.extras != 'none'
        run: python examples/gallery.py
