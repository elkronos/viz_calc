name: Docs

# Builds the documentation site and publishes it to the `gh-pages` branch.
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "Deploy from a branch", Branch: gh-pages, folder: / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[docs]"
      - name: Render gallery images and page
        run: python examples/gallery.py
      - name: Publish to gh-pages
        run: |
          git config user.name "elkronos"
          git config user.email "130187349+elkronos@users.noreply.github.com"
          mkdocs gh-deploy --strict --force --no-history \
            --remote-branch gh-pages \
            --message "Publish docs for {sha}"
