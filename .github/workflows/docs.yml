name: Docs

# Builds the documentation site and publishes it to the `gh-pages` branch.
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "Deploy from a branch", Branch: gh-pages, folder: / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[docs]"
      - name: Render gallery images and page
        run: python examples/gallery.py
      - name: Publish to gh-pages
        run: |
          git config user.name "elkronos"
          git config user.email "130187349+elkronos@users.noreply.github.com"
          mkdocs gh-deploy --strict --force --no-history \
            --remote-branch gh-pages \
            --message "Publish docs for {sha}"
