name: Publish

# Uploads the sdist and wheel to PyPI when a GitHub release is published and the tests pass with the
# built wheel installed. PyPI trusted publishing authorizes the upload, so the repository stores no
# PyPI token. RELEASING.md lists the one-time setup on PyPI and in the repository settings, and the
# steps for each release.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
      - name: Check the distributions
        run: twine check --strict dist/*
      - name: Check the release tag against the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The wheel's file name carries the version as PyPI will show it.
          version=$(basename dist/*.whl | cut -d- -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release tag is $TAG, but the tag for package version $version is v$version."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      # pytest imports the installed wheel, because the checkout's src/ is not on the import path.
      - name: Install the wheel
        run: |
          python -m pip install --upgrade pip
          pip install "$(echo dist/*.whl)[dev]"
      - name: Test
        run: pytest

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PyPI accepts an upload only from this workflow file and this environment.
    environment:
      name: pypi
      url: https://pypi.org/p/viz_calc
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
